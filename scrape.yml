name: Daily Data Scrape and Commit

on:
  # Allows manual running from the Actions tab
  workflow_dispatch:
  schedule:
    # Run once a day at midnight UTC
    - cron: '0 0 * * *' 

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest
    
    # 1. Setup Service Containers: Ensure Chrome is available for undetected-chromedriver
    # Although undetected-chromedriver handles driver download, we need the environment for Chrome to run.
    # This step is often the key difference between local and cloud scraping success.
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          # Use the default token for permissions to push back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' 

      # FIX: Install all necessary system dependencies for running Chrome in headless mode
      - name: Install System Dependencies for Headless Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser libnss3 libasound2 libatk-bridge2.0-0 libpangocairo-1.0-0 libgbm-dev

      - name: Install Python Dependencies
        run: |
          # Install Python dependencies including undetected-chromedriver
          pip install selenium undetected-chromedriver beautifulsoup4
          
      - name: Run Scraper Script and Generate JSON
        run: |
          # Execute the script to generate the updated promotions.json
          python scraper.py
        env:
          PYTHONIOENCODING: utf-8 

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 Automated: Update promotions.json with daily scrape'
          file_pattern: 'promotions.json'
          branch: main
