name: Daily Data Scrape and Commit

on:
  # Allows manual running from the Actions tab
  workflow_dispatch:
  schedule:
    # Run once a day at midnight UTC
    - cron: '0 0 * * *' 

jobs:
  scrape_and_commit:
    # FIX 1: Add permissions block to allow the GITHUB_TOKEN to commit changes
    permissions:
      contents: write 
    
    # Using the latest high-availability runner
    runs-on: ubuntu-latest 
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' 
      
      # FIX 2: Install setuptools before other Python dependencies to fix the 'distutils' error.
      - name: Install Critical Python Setup Tools
        run: |
          pip install setuptools
          
      # FIX 3 (CRITICAL): Install Google Chrome explicitly and reliably.
      # Requesting a version compatible with the ChromeDriver (141)
      - name: Install Google Chrome (Guaranteed Version)
        uses: browser-actions/setup-chrome@latest
        with:
          # CRITICAL FIX: Requesting Chrome Version 141 to match the latest driver
          chrome-version: '141.0.7390.54' 

      - name: Install Python Dependencies (Includes WebDriver)
        run: |
          # undetected-chromedriver will auto-download the matching driver for the requested browser
          pip install selenium undetected-chromedriver beautifulsoup4
          
      - name: Run Scraper Script and Generate JSON
        run: |
          # The scraper.py script must contain the updated initialize_browser() function pointing to /usr/bin/google-chrome
          python scraper.py
        env:
          PYTHONIOENCODING: utf-8 

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 Automated: Update promotions.json with daily scrape'
          file_pattern: 'promotions.json'
          branch: main
