name: Daily Data Scrape and Commit

on:
  # Allows manual running from the Actions tab
  workflow_dispatch:
  schedule:
    # Run once a day at midnight UTC
    - cron: '0 0 * * *' 

jobs:
  scrape_and_commit:
    # Using the latest high-availability runner
    runs-on: ubuntu-latest 
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' 
      
      # FIX 1: Install setuptools before other Python dependencies to fix the 'distutils' error.
      - name: Install Critical Python Setup Tools
        run: |
          pip install setuptools
          
      - name: Install System Dependencies for Chromium
        # Using '|| true' to continue past non-critical system install errors (like libasound)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser libnss3 libasound2t64 libatk-bridge2.0-0 libpangocairo-1.0-0 libgbm-dev || true
          
      - name: Install Python Dependencies (Includes WebDriver)
        run: |
          pip install selenium undetected-chromedriver beautifulsoup4
          
      - name: Run Scraper Script and Generate JSON
        run: |
          # The script will execute here. If it successfully finishes scraping, the next step will commit the data.
          python scraper.py
        env:
          PYTHONIOENCODING: utf-8 

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 Automated: Update promotions.json with daily scrape'
          file_pattern: 'promotions.json'
          branch: main
