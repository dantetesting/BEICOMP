name: Daily Data Scrape and Commit

on:
  # Allows manual running from the Actions tab
  workflow_dispatch:
  schedule:
    # Run once a day at midnight UTC
    - cron: '0 0 * * *' 

jobs:
  scrape_and_commit:
    # Use a slightly older runner version known to work well with Selenium dependencies
    runs-on: ubuntu-20.04 
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          # Use the default token for permissions to push back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' 

      - name: Install System Dependencies for Chromium
        # This step is critical for headless browser environments
        run: |
          sudo apt-get update
          # Install Chromium and necessary system libraries
          sudo apt-get install -y chromium-browser libnss3 libasound2 libatk-bridge2.0-0 libpangocairo-1.0-0 libgbm-dev
          
      - name: Install Python Dependencies (Includes WebDriver)
        run: |
          # undetected-chromedriver automatically finds the Chromium installed above
          pip install selenium undetected-chromedriver beautifulsoup4
          
      - name: Run Scraper Script and Generate JSON
        run: |
          # Execute the script to generate the updated promotions.json
          python scraper.py
        env:
          PYTHONIOENCODING: utf-8 

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 Automated: Update promotions.json with daily scrape'
          file_pattern: 'promotions.json'
          branch: main
