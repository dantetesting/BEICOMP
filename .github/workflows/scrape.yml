name: Daily Data Scrape and Commit

on:
  # Memungkinkan dijalankan secara manual dari tab Actions
  workflow_dispatch:
  schedule:
    # Jadwal berjalan sekali sehari pada tengah malam UTC
    - cron: '0 0 * * *' 

jobs:
  scrape_and_commit:
    # FIX 1: Menambahkan izin untuk memungkinkan GitHub Actions melakukan commit
    permissions:
      contents: write 
    
    runs-on: ubuntu-latest 
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' 
      
      # FIX 2: Menginstal setuptools untuk mengatasi ModuleNotFoundError: No module named 'distutils'
      - name: Install Critical Python Setup Tools
        run: |
          pip install setuptools
          
      # FIX 3 (CRITICAL): Menginstal Google Chrome versi stabil terbaru (Implementasi Opsi A)
      - name: Update/Install Google Chrome Latest
        run: |
          # 1. Unduh dan tambahkan GPG key Google
          sudo mkdir -p /etc/apt/keyrings
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
          # 2. Tambahkan repository Chrome ke daftar sumber APT
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list > /dev/null
          # 3. Update dan instal/upgrade Chrome versi stabil
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || sudo apt-get --only-upgrade install -y google-chrome-stable
          # 4. Tampilkan versi untuk debugging
          google-chrome --version
          
      - name: Install Python Dependencies (Includes WebDriver)
        run: |
          # undetected-chromedriver akan auto-download the matching driver for the new browser
          pip install selenium undetected-chromedriver beautifulsoup4
          
      - name: Run Scraper Script and Generate JSON
        run: |
          python scraper.py
        env:
          PYTHONIOENCODING: utf-8 

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 Automated: Update promotions.json with daily scrape'
          file_pattern: 'promotions.json'
          branch: main
